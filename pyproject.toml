[project]
name = "quench"
version = "0.1.0"
description = "A determinism compiler for agent runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hem Chandra Padhalni", email = "shramanpadhalni@gmail.com" }]
keywords = ["llm", "agents", "determinism", "compiler", "mcp", "finops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Compilers",
]

dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
# The MCP server surface, so any MCP-speaking agent can drive Quench.
mcp = ["mcp>=2"]
dev = ["pytest>=8"]

[project.scripts]
quench = "quench_cli.main:main"

[project.urls]
Homepage = "https://github.com/shramanpadhalni-web/quench"
Repository = "https://github.com/shramanpadhalni-web/quench"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The components live in their own src/ trees so each stays independently
# testable and replaceable. Packaging them together is a distribution decision,
# not an architectural one - the ports still separate them.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = [
  "src",
  "cast/src",
  "assay/src",
  "vault/src",
  "mill/src",
  "kernel/src",
  "saga/src",
  "pack/src",
  "exchange/src",
]
