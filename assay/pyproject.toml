[project]
name = "quench-assay"
version = "0.1.0"
description = "Deterministic verifier - seal-time verification and runtime drift checking"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
